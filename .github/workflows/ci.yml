name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [ "22", "24" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit high-severity dependencies
        if: matrix.node-version == '24'
        run: npm run audit:security

      - name: Lint, type-check, test, and build
        run: npm run build

      - name: Smoke test published package
        run: npm run verify:package

      - name: Check representative bundle sizes
        run: npm run verify:size

      - name: Collect test coverage
        if: matrix.node-version == '24'
        run: npm run test:coverage
